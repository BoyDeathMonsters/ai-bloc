<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI Bloc</title>
  <meta name="description" content="AI Bloc — le coach de bloc dans ta poche. Progresse, prise après prise.">
  <meta name="theme-color" content="#FFF9F2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141110" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AI Bloc">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    try { var t = localStorage.getItem('aibloc:theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="app" id="app">
    <main id="view" class="view"></main>
    <nav id="tabbar" class="tabbar" hidden></nav>
  </div>
  <div id="layers"></div>
  <noscript>AI Bloc a besoin de JavaScript pour fonctionner.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
